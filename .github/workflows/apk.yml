# Compila o APK na nuvem do GitHub (não precisa de Android Studio)
name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android      # cria o projeto Android a partir de www/
      - run: npx cap sync android     # copia o app e os plugins
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dock-liquida-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
