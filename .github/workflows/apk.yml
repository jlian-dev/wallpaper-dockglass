# Compila o APK de teste na nuvem do GitHub (não precisa de Android Studio)
name: Gerar APK
on:
  push:
    tags-ignore: ['v*']        # as tags de versão são tratadas pelo release.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }        # sem gradlew: o próprio workflow instala o Gradle
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dock-liquida-apk
          path: app/build/outputs/apk/debug/app-debug.apk
