# Publica um APK ASSINADO numa Release do GitHub.
# Como usar: crie uma tag de versão (ex.: v1.0.0) em Releases > Draft a new release. O resto é automático.
name: Publicar release (APK)
on:
  push:
    tags: ['v*']
permissions:
  contents: write          # necessário para anexar o APK na Release
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # chave de assinatura guardada em Settings > Secrets and variables > Actions (nunca no código)
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Definir a versão a partir da tag (v1.2.3 -> nome 1.2.3, código 10203)
        run: |
          V="${REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$V'/" www/script.js   # a tela "Sobre" mostra a mesma versão

      - run: npm install
      - run: npx cap add android          # cria o projeto Android a partir de www/
      - run: node patch-android.js        # plugin nativo, permissões, WorkManager e a versão do app
      - run: npx cap sync android         # copia o app e os plugins

      - name: Compilar
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Assinar o APK
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alinhado.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/DockLiquida-v$APP_VERSION_NAME.apk" "$RUNNER_TEMP/alinhado.apk"
            "$BT/apksigner" verify --print-certs "dist/DockLiquida-v$APP_VERSION_NAME.apk"
          else
            echo "::warning::Sem chave de assinatura nos Secrets: publicando o APK de teste (debug)."
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/DockLiquida-v$APP_VERSION_NAME-debug.apk"
          fi

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
