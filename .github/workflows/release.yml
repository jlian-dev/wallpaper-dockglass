# Publica um APK ASSINADO numa Release do GitHub.
# Como usar: crie uma tag de versão (ex.: v2.0.0) em Releases > Draft a new release. O resto é automático.
name: Publicar release (APK)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Versão a partir da tag (v1.2.3 -> nome 1.2.3, código 10203)
        run: |
          V="${REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          if [ -n "$KEYSTORE_B64" ]; then T=assembleRelease; else T=assembleDebug; fi
          gradle $T -PversionName="$APP_VERSION_NAME" -PversionCode="$APP_VERSION_CODE" --stacktrace

      - name: Assinar o APK
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alinhado.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/DockLiquida-v$APP_VERSION_NAME.apk" "$RUNNER_TEMP/alinhado.apk"
            "$BT/apksigner" verify --print-certs "dist/DockLiquida-v$APP_VERSION_NAME.apk"
          else
            echo "::warning::Sem chave de assinatura nos Secrets: publicando o APK de teste (debug)."
            cp app/build/outputs/apk/debug/app-debug.apk "dist/DockLiquida-v$APP_VERSION_NAME-debug.apk"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
